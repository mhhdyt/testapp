# /etc/nginx/sites-available/testapp.conf
# deploy.sh otomatis mengganti root, server_name, dan versi PHP sesuai variabel.
# Pasang manual: sudo ln -s /etc/nginx/sites-available/testapp.conf /etc/nginx/sites-enabled/
#                sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    # Ganti dengan domain/IP server. "_" = semua nama (nonaktifkan site default nginx).
    server_name _;

    root /var/www/testapp/public;
    index index.php;

    charset utf-8;
    client_max_body_size 10M;   # samakan dengan post_max_size di 99-testapp.ini

    access_log /var/log/nginx/testapp.access.log;
    error_log  /var/log/nginx/testapp.error.log;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Gambar hasil upload: file statis saja, PHP tidak boleh dieksekusi di sini
    location ^~ /uploads/ {
        location ~* \.(php|phtml|phar|pl|py|sh|cgi)$ { deny all; }
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Batasi halaman diagnostik ke jaringan internal (aktifkan & sesuaikan bila perlu)
    # location = /system.php {
    #     allow 192.168.0.0/16;
    #     allow 10.0.0.0/8;
    #     deny all;
    #     include snippets/fastcgi-php.conf;
    #     fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    # }

    # Tolak file tersembunyi (.env, .git, .htaccess, dll.) — harus di atas blok PHP
    location ~ /\. {
        deny all;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 60s;
    }
}

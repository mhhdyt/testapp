; /etc/php/8.3/fpm/conf.d/99-custom.ini  (SERVER 1 web-01 & SERVER 3 web-02)
; Batas upload & memori sesuai panduan server. Setelah diubah: sudo systemctl restart php8.3-fpm
; client_max_body_size (nginx) dan fastcgi_read_timeout harus mengikuti nilai di bawah.

upload_max_filesize = 64M
post_max_size       = 64M
memory_limit        = 256M
max_execution_time  = 120

; --- Tambahan untuk aplikasi -------------------------------------------------
date.timezone = Asia/Jakarta

expose_php = Off
display_errors = Off
log_errors = On

session.cookie_httponly = 1
session.use_strict_mode = 1

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
